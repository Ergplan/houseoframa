# The same checks the watcher runs (CLAUDE.md §4), once, against a fresh Postgres 16.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rama
          POSTGRES_PASSWORD: rama
          POSTGRES_DB: rama
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rama"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://rama:rama@localhost:5432/rama
      BUILDER_VENDOR: anthropic
      AUDITOR_VENDOR: openai
      RAMA_MEMBER_NAME: CI
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # blueprint/self.json carries the full history, and must be checked against the commit a
          # developer made, not GitHub's synthetic merge commit for a pull request.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clone the golden target (MASTER-PROMPT §7.1)
        run: |
          git clone --quiet https://github.com/Ergplan/procurementstudio reference/procurementstudio
          git -C reference/procurementstudio checkout --quiet fac615d
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Watcher checks
        run: node scripts/watch.mjs --once
      - name: Status
        if: always()
        run: cat .watch/status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-status
          path: .watch/
          include-hidden-files: true
