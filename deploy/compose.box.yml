# House of Rama on the pod box (docs/DEPLOY.md). From the repository root:
#   docker compose -f deploy/compose.box.yml --env-file .env up -d --build
# Postgres is reachable only inside the box. Site clones (work/) and nightly backups (backups/) are
# volumes that survive a rebuild.
name: rama-box
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rama
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rama']
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://rama:${POSTGRES_PASSWORD}@db:5432/rama
      GIT_SHA: ${GIT_SHA:-unknown}
    ports: ['${APP_PORT:-3000}:3000']
    volumes: ['work:/app/work']
    depends_on:
      db: { condition: service_healthy }
  watcher:
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://rama:${POSTGRES_PASSWORD}@db:5432/rama
      NODE_ENV: development
    command: ['node', 'scripts/watch.mjs', '--once']
    volumes: ['work:/app/work']
    depends_on:
      app: { condition: service_started }
    profiles: [checks]
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: rama
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rama
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ['sh', '/deploy/backup.sh']
    volumes: ['./backup.sh:/deploy/backup.sh:ro', '../backups:/backups']
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
  work:
