<meta charset="utf-8">
<title>House of Rama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the pixel construction site is the only retro thing on the page. Everything around it (controls, inspector, showroom, discovery) is a modern dark product UI: Plex Sans for reading, Plex Mono for paths and numbers. Single deliberate dark theme. */
:root{
  --bg:#0c0b13;
  --panel:#14121d;
  --panel2:#1b1826;
  --fg:#ece8dc;
  --dim:#9a958a;
  --amber:#ffb429;
  --cyan:#4fe3d8;
  --red:#ff5a6a;
  --green:#5ad45a;
  --violet:#c98cff;
  --line:#2a2740;
  --pixel:'Press Start 2P',monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;margin:0}
*{box-sizing:border-box}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.hud h1{font-family:var(--pixel);font-size:13px;margin:0;color:var(--amber);letter-spacing:1px;text-shadow:0 0 14px rgba(255,180,41,.35)}
.hud .tag{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.hud .site{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--cyan)}
.cab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:16px}
@media (max-width:900px){.cab{grid-template-columns:minmax(0,1fr)}}
.screen{position:relative;background:#12101c;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;min-width:0}
.screen canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
.tip{position:absolute;pointer-events:none;font-family:var(--mono);font-size:12px;background:rgba(12,11,19,.92);color:var(--fg);padding:6px 9px;border:1px solid var(--amber);border-radius:8px;white-space:nowrap;display:none;z-index:2}
.deck{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.deck .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
button{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:var(--amber);color:var(--amber)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
button.on:hover{color:#1a1200}
button.primary{background:var(--amber);color:#1a1200;border-color:var(--amber)}
button.primary:hover{color:#1a1200;filter:brightness(1.08)}
.clock{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--amber);margin-left:auto;font-variant-numeric:tabular-nums}
.track{position:relative;margin:18px 10px 4px;height:48px}
.track .rail{position:absolute;left:0;right:0;top:10px;height:4px;background:#2d2a40;border-radius:2px}
.track .fill{position:absolute;left:0;top:10px;height:4px;background:var(--amber);border-radius:2px;width:0}
.tick{position:absolute;top:2px;width:20px;height:20px;margin-left:-10px;background:var(--panel2);border:2px solid #3a3650;border-radius:50%;cursor:pointer;padding:0;font-size:0;transition:transform .15s}
.tick:hover{transform:scale(1.15);border-color:var(--amber)}
.tick.done{background:var(--amber);border-color:var(--amber)}
.tick.cur{box-shadow:0 0 0 4px rgba(79,227,216,.35);border-color:var(--cyan)}
.tick span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:6px;border-radius:3px}
.mon{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.mon h2{font-size:11.5px;font-weight:600;color:var(--cyan);margin:0 0 10px;letter-spacing:.1em;text-transform:uppercase}
.mon h3{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--amber);margin:12px 0 8px;word-break:break-all;line-height:1.45}
.mon p{margin:8px 0}
.kv{display:grid;grid-template-columns:fit-content(46%) minmax(0,1fr);gap:6px 14px;margin:10px 0;font-variant-numeric:tabular-nums;font-size:14px}
.kv dt{color:var(--dim)}.kv dd{margin:0;min-width:0;word-break:break-word}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border:1px solid;border-radius:999px;margin:2px 6px 2px 0}
.pill.red{color:var(--red);border-color:rgba(255,90,106,.6);background:rgba(255,90,106,.08)}.pill.green{color:var(--green);border-color:rgba(90,212,90,.6);background:rgba(90,212,90,.08)}.pill.cyan{color:var(--cyan);border-color:rgba(79,227,216,.6);background:rgba(79,227,216,.08)}.pill.amber{color:var(--amber);border-color:rgba(255,180,41,.6);background:rgba(255,180,41,.08)}
.links span,.lnk{display:block;cursor:pointer;color:var(--cyan);font-family:var(--mono);font-size:13px;padding:3px 0;line-height:1.4}
.links span:hover,.lnk:hover{color:var(--amber)}
.links small{color:var(--dim);font-size:12px}
.big{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.big.red{color:var(--red)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.stat b{display:block;font-size:22px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:12px;color:var(--dim)}
.mon .note{color:var(--dim);font-size:13.5px;border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.back{margin-top:14px}
.ov[hidden]{display:none}
.ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:3}
.ov .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ov .bar h4{font-size:13px;font-weight:600;color:var(--fg);margin:0;letter-spacing:.02em}
.ov .bar .real{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green);border:1px solid rgba(90,212,90,.6);border-radius:999px;padding:3px 9px}
.ov .bar .real.amb{color:var(--amber);border-color:rgba(255,180,41,.6)}
.ov .bar button{margin-left:auto}
.ov .view{flex:1;min-height:0;overflow:auto;background:#1a1826;padding:12px}
.ov .view img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;image-rendering:auto}
.ov .strip{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
.ov .strip button{flex:0 0 auto;padding:4px;border-radius:8px;background:var(--panel2);text-transform:none;letter-spacing:0;font-weight:500}
.ov .strip button.on{border-color:var(--amber)}
.ov .strip img{display:block;width:104px;height:64px;object-fit:cover;object-position:top;border-radius:5px;image-rendering:auto}
.ov .strip span{display:block;font-size:11px;color:var(--dim);margin-top:4px;text-align:center;max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep{padding:6px 0;border-bottom:1px dashed var(--line)}.dep:last-child{border-bottom:0}.dep .en{font-size:13px;color:var(--dim);line-height:1.45;padding-left:14px}.dep .en::first-letter{text-transform:uppercase}
.reviewer{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;margin:10px 0}
.shotwrap{position:relative;display:inline-block;max-width:100%}
.hot{position:absolute;border:2px solid var(--amber);border-radius:6px;background:rgba(255,180,41,.10);padding:0;cursor:pointer;box-shadow:0 0 0 3px rgba(255,180,41,.18);animation:hotpulse 1.8s ease-in-out infinite}
.hot:hover{background:rgba(255,180,41,.28)}
@keyframes hotpulse{0%,100%{box-shadow:0 0 0 2px rgba(255,180,41,.15)}50%{box-shadow:0 0 0 6px rgba(255,180,41,.35)}}
@media (prefers-reduced-motion:reduce){.hot{animation:none}}
.ov .bar .hint{font-size:12px;color:var(--dim)}
pre.code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:8px 0;color:var(--cyan)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.sig div{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.sig .k{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.sig .v{display:block;font-size:15px;font-weight:600;margin-top:2px}.sig .v.red{color:var(--red)}
.alog{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.aph{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-top:6px}
.asay{font-size:14px;line-height:1.5;border-left:2px solid var(--violet);padding-left:10px}
.afind{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--panel)}.afind.fail{border:1px solid rgba(255,90,106,.45)}.afind.warn{border:1px solid rgba(255,180,41,.45)}
.afind .en{font-size:13px;color:var(--dim);margin-top:4px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.thumbs button{padding:4px;border-radius:8px;background:var(--panel2);text-align:left;text-transform:none;letter-spacing:0;font-weight:500}
.thumbs img{display:block;width:100%;height:64px;object-fit:cover;object-position:top;border-radius:5px;image-rendering:auto}
.thumbs span{display:block;font-size:11px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* discovery session */
.disc{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1;min-height:0}
@media (max-width:700px){.disc{grid-template-columns:minmax(0,1fr)}.disc .agenda{display:none}}
.agenda{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px}
.agenda h5{margin:4px 6px 8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.agenda button{display:block;width:100%;text-align:left;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;background:transparent;border-color:transparent;padding:7px 8px;border-radius:8px}
.agenda button small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim)}
.agenda button:hover{background:var(--panel2);color:var(--fg)}
.agenda button.on{background:var(--panel2);border-color:var(--line);color:var(--amber)}
.chat{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.chat{scroll-behavior:auto}}
.topic{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 0 -4px;display:flex;align-items:center;gap:10px;scroll-margin-top:12px}
.topic::after{content:"";flex:1;height:1px;background:var(--line)}
.topic time{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;max-width:720px}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#0c0b13;letter-spacing:.02em}
.msg .who{font-size:12px;color:var(--dim);margin-bottom:3px}
.msg .who b{color:var(--fg);font-weight:600}
.msg .body{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.5}
.msg.agent .body{border-color:rgba(255,180,41,.35);background:rgba(255,180,41,.06)}
.dec{border:1px solid rgba(90,212,90,.45);background:rgba(90,212,90,.06);border-radius:12px;padding:12px 14px;max-width:720px;margin-left:44px}
.dec.warn{border-color:rgba(255,90,106,.5);background:rgba(255,90,106,.06)}
.dec .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.dec .h b{font-size:14px;font-weight:600}
.dec .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.dec .chips span{font-family:var(--mono);font-size:11.5px;color:var(--cyan);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer}
.dec .chips span:hover{color:var(--amber);border-color:var(--amber)}
.dec button{margin-top:6px;font-size:11px;padding:6px 10px}
.dec .note{font-size:13px;color:var(--dim);margin:4px 0 0}
</style>

<header class="hud">
  <h1>HOUSE OF RAMA</h1>

<div class="cab">

      <div class="legend" id="legend"></div>

  </div>
  <aside class="mon" id="mon"></aside>
</div>

function buildTrail(files){ // commits that touched these files, newest first, from git
  const rows=[];files.forEach(f=>{const n=byPath[f];if(!n)return;n.changes.forEach(x=>rows.push({c:x.c,f,ch:x.ch}));});
  rows.sort((a,b)=>a.c.t-b.c.t);
  return rows.map(r=>`<div class="dep"><span class="lnk" data-p="${r.f}">${r.f}</span><div class="en">${r.ch.kind==='A'?'laid':'reworked +'+r.ch.add+' / −'+r.ch.del} · lift ${r.c.i+1}, ${fmtT(r.c.t)} IST · ${esc(r.c.author)} · "${esc(r.c.subject)}"</div></div>`).join('');
}

  <h2 style="margin-top:16px">3 · Where the data lives</h2>${t.data.map(d=>`<p>${esc(d)}</p>`).join('')}

  <h2 style="margin-top:16px">5 · Review &amp; sign-off</h2>
  <div class="sig"><div><span class="k">Reviewed by</span><span class="v">—</span></div><div><span class="k">Signed off by</span><span class="v">—</span></div><div><span class="k">Status</span><span class="v red">Unsigned</span></div><div><span class="k">Automated check</span><span class="v red">None</span></div></div>

function auditScript(){

  phase('Audit requested');
  say('Second-opinion audit of Procurement Studio, commit fac615d. Two drones. We will fly from the discovery session to the data and back, and say everything we see.');
  phase('Discovery');
  say('Eight decisions recorded in the site office. All eight have bricks in the building. Two items were left open: automated checks on the formulas, and who signs off an award. Both are still open.',4);
  G.layers.forEach(L=>{
    const bricks=nodes.filter(n=>n.layer===L.id).sort((a,b)=>a.x-b.x);
    phase(L.label.split(' — ')[0]+' floor');
    const clean=bricks.filter(b=>!VERDICT[b.path]);
    bricks.forEach(b=>{const v=VERDICT[b.path];S.push({kind:'scan',n:b,v:v?v[0]:'pass',note:v?v[1]:PASS_NOTE,d:v?3.6:0.45});if(v)S.push({kind:'say',quiet:true,t:(v[0]==='fail'?'Defect. ':'Note. ')+b.path.split('/').pop()+'. '+v[1],d:v[0]==='fail'?4.2:3.4});});
    if(clean.length)say(`${clean.length} of ${bricks.length} bricks on this floor are clean by static checks. None of them has a test.`,2.4);
  });
  phase('Screens');
  say('Eight screens photographed from the built app. Every figure we traced recomputes to the value on screen: 1.50 crore, 37 percent, 92 out of 100, 3.37 crore. The arithmetic is right for this dataset.',4);
  phase('Sign-offs');
  say('Thirty-four bricks. Zero tests. Zero reviews recorded. Zero sign-offs. There is no signature anywhere in this repository, so there is none we can confirm and none we can reject. The building is unsigned.',4.4);
  phase('Verdict');
  say('Three defects, nine notes, twenty-two clean. The building stands; it needs alteration in five places before a committee should rely on it. Estimates follow.',3.6);
  S.push({kind:'report',d:1});

}

}

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
